{% extends "finance/base.html" %}
{% load static %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-lang">{% include "finance/lang_switch.html" %}</div>

<section class="card auth-card">
  <h1 class="logo">🌸 ShaxsiyHisobchi</h1>
  <p class="subtitle" data-i18n="login.subtitle">Kirim-chiqimlaringiz bir joyda 💖</p>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="login" data-i18n="login.tab_login">Kirish</button>
    <button type="button" class="tab" data-tab="register" data-i18n="login.tab_register">Ro'yxatdan o'tish</button>
  </div>

  <form id="login-form" class="form">
    <label><span data-i18n="login.login">Username yoki email</span>
      <input type="text" name="login" required autocomplete="username">
    </label>
    <label><span data-i18n="login.password">Parol</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <p class="form-error" hidden></p>
    <button type="submit" class="btn" data-i18n="login.btn_login">Kirish 🌷</button>
  </form>

  <form id="register-form" class="form" hidden>
    <label><span data-i18n="login.username">Username</span>
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label><span data-i18n="login.email">Email</span>
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label><span data-i18n="login.password">Parol</span>
      <input type="password" name="password" required autocomplete="new-password">
    </label>
    <label><span data-i18n="login.password2">Parolni takrorlang</span>
      <input type="password" name="password2" required autocomplete="new-password">
    </label>
    <p class="form-error" hidden></p>
    <button type="submit" class="btn" data-i18n="login.btn_register">Ro'yxatdan o'tish 🌺</button>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'finance/js/login.js' %}"></script>
{% endblock %}
