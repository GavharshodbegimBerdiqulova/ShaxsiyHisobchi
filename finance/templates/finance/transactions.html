{% extends "finance/base_app.html" %}
{% load static %}

{% block page_actions %}
<button type="button" class="btn" id="add-btn" data-i18n="common.add">+ Qo'shish</button>
{% endblock %}

{% block page %}
{# kind: income yoki expense, JS shu qiymat bo'yicha ishlaydi #}
<section class="card" id="page-data" data-kind="{{ kind }}">
  <form class="filters" id="filters">
    <label><span data-i18n="tx.from">Sanadan</span> <input type="date" name="date_from"></label>
    <label><span data-i18n="tx.to">Sanagacha</span> <input type="date" name="date_to"></label>
    <label><span data-i18n="common.account">Hisob</span>
      <select name="account"><option value="" data-i18n="common.all">Hammasi</option></select>
    </label>
    <label><span data-i18n="common.type">Tur</span>
      <select name="type"><option value="" data-i18n="common.all">Hammasi</option></select>
    </label>
    <button type="button" class="btn btn-small btn-light" id="reset-btn" data-i18n="tx.reset">Tozalash</button>
  </form>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th data-i18n="common.date">Sana</th>
          <th data-i18n="common.type">Tur</th>
          <th data-i18n="common.account">Hisob</th>
          <th class="right" data-i18n="common.amount">Summa</th>
          <th data-admin-only hidden data-i18n="common.owner">Egasi</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden data-i18n="common.no_records">Hali yozuv yo'q 🌸</p>
</section>
{% endblock %}

{% block page_scripts %}
<script src="{% static 'finance/js/transactions.js' %}"></script>
{% endblock %}
